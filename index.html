<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song To Video AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#08090d;
  color:#fff;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:30px 18px 60px;
}

header{
  text-align:center;
  margin-bottom:30px;
}

header h1{
  font-size:32px;
  margin:0 0 8px;
}

header p{
  color:#a9afbd;
  margin:0;
}

.card{
  background:#11141c;
  border:1px solid #292e3a;
  border-radius:16px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

label{
  display:block;
  margin-bottom:8px;
  color:#cbd1dc;
  font-weight:bold;
}

input,
select,
textarea{
  width:100%;
  background:#080a0f;
  color:#fff;
  border:1px solid #343a48;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#7c8cff;
}

textarea{
  min-height:220px;
  resize:vertical;
  line-height:1.5;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.field{
  margin-bottom:18px;
}

.filebox{
  border:2px dashed #363c49;
  border-radius:12px;
  padding:20px;
  text-align:center;
}

.filebox input{
  border:0;
  padding:8px;
}

.info{
  color:#9da5b5;
  font-size:13px;
  margin-top:8px;
}

button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:15px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:linear-gradient(135deg,#6675ff,#8d4cff);
  color:#fff;
}

button:hover{
  filter:brightness(1.1);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.status{
  margin-top:15px;
  padding:13px;
  border-radius:10px;
  background:#0b0e14;
  color:#aeb6c6;
  display:none;
}

.error{
  color:#ff7d7d;
  background:#241014;
  border:1px solid #5c242c;
}

.success{
  color:#7dffa5;
  background:#0d2115;
  border:1px solid #205d32;
}

.scene{
  background:#0b0e14;
  border:1px solid #2b303c;
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
}

.scene-title{
  color:#9ca8ff;
  font-weight:bold;
  margin-bottom:8px;
}

.scene-time{
  color:#777f91;
  font-size:13px;
  margin-bottom:10px;
}

.scene h3{
  margin:5px 0 10px;
}

.scene p{
  color:#c2c8d3;
  line-height:1.5;
  margin:7px 0;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#1b2030;
  color:#b7c0ff;
  font-size:12px;
  margin-right:5px;
}

.hidden{
  display:none;
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  header h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🎬 Song To Video AI</h1>
  <p>AI Music Film Generator — Gemini Story & Cinematic Storyboard</p>
</header>

<div class="card">

  <div class="field">
    <label>🎵 Upload Lagu</label>

    <div class="filebox">
      <input
        id="audioFile"
        type="file"
        accept="audio/mpeg,audio/wav,audio/*"
      >

      <div id="audioInfo" class="info">
        Pilih file MP3 atau WAV
      </div>
    </div>
  </div>

  <div class="grid">

    <div class="field">
      <label>Judul Lagu</label>
      <input
        id="songTitle"
        type="text"
        value="Let Me Go"
        placeholder="Contoh: Let Me Go"
      >
    </div>

    <div class="field">
      <label>Artis</label>
      <input
        id="artist"
        type="text"
        value="Liora"
        placeholder="Nama artis"
      >
    </div>

    <div class="field">
      <label>Durasi Film</label>

      <select id="duration">
        <option value="4">4 menit</option>
        <option value="4.5">4 menit 30 detik</option>
        <option value="5">5 menit</option>
      </select>
    </div>

    <div class="field">
      <label>Format Video</label>

      <select id="format">
        <option value="16:9">16:9 Cinematic YouTube</option>
        <option value="9:16">9:16 Vertical Shorts</option>
      </select>
    </div>

  </div>

</div>

<div class="card">

  <div class="field">

    <label>📝 Lirik / Cerita Lagu</label>

    <textarea
      id="lyrics"
      placeholder="Tempel lirik lagu di sini..."
    >Let me go... I won't chase you again
You broke the heart that trusted you
But I survived what you put me through

Let me go... I finally see the truth
I lost myself while loving you
You chose her, so I'll choose me
This is the end... now let me be free

[Chorus]
Let me go...
Don't come back...
I've cried enough for you...
Now I'm choosing my heart.</textarea>

  </div>

  <button id="storyboardBtn">
    🎬 Buat Storyboard AI
  </button>

  <div id="status" class="status"></div>

</div>

<div id="resultCard" class="card hidden">

  <h2>🎞️ Storyboard Film</h2>

  <div id="filmInfo" class="info"></div>

  <div id="scenes"></div>

</div>

</div>

<script>

const audioFile = document.getElementById("audioFile");
const audioInfo = document.getElementById("audioInfo");
const storyboardBtn = document.getElementById("storyboardBtn");
const statusBox = document.getElementById("status");
const resultCard = document.getElementById("resultCard");
const scenesBox = document.getElementById("scenes");
const filmInfo = document.getElementById("filmInfo");

audioFile.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    audioInfo.textContent = "Pilih file MP3 atau WAV";
    return;
  }

  const audio = document.createElement("audio");

  audio.preload = "metadata";

  audio.onloadedmetadata = function(){

    const minutes = Math.floor(audio.duration / 60);

    const seconds = Math.floor(audio.duration % 60)
      .toString()
      .padStart(2,"0");

    audioInfo.innerHTML =
      "✅ " + file.name +
      " — Durasi: " +
      minutes + ":" + seconds;
  };

  audio.src = URL.createObjectURL(file);

});


function showStatus(message,type=""){

  statusBox.style.display = "block";

  statusBox.className = "status " + type;

  statusBox.textContent = message;

}


function cleanJsonText(text){

  if(!text) return "";

  text = text.trim();

  if(text.startsWith("```")){
    text = text
      .replace(/^```json/i,"")
      .replace(/^```/,"")
      .replace(/```$/,"")
      .trim();
  }

  return text;
}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function renderScenes(data){

  scenesBox.innerHTML = "";

  const scenes = Array.isArray(data.scenes)
    ? data.scenes
    : [];

  if(!scenes.length){

    scenesBox.innerHTML =
      "<p>Tidak ada scene yang berhasil dibuat.</p>";

    return;
  }

  scenes.forEach((scene,index)=>{

    const number = index + 1;

    const div = document.createElement("div");

    div.className = "scene";

    div.innerHTML = `

      <div class="scene-title">
        SCENE ${number}
      </div>

      <div class="scene-time">
        ⏱️ ${escapeHtml(scene.start)} —
        ${escapeHtml(scene.end)}
      </div>

      <h3>
        ${escapeHtml(scene.title)}
      </h3>

      <p>
        <span class="badge">Story</span>
        ${escapeHtml(scene.story)}
      </p>

      <p>
        <span class="badge">Visual</span>
        ${escapeHtml(scene.visual)}
      </p>

      <p>
        <span class="badge">Camera</span>
        ${escapeHtml(scene.camera)}
      </p>

      <p>
        <span class="badge">Mood</span>
        ${escapeHtml(scene.mood)}
      </p>

      <p>
        <span class="badge">Character</span>
        ${escapeHtml(scene.character)}
      </p>

      <p>
        <span class="badge">Location</span>
        ${escapeHtml(scene.location)}
      </p>

    `;

    scenesBox.appendChild(div);

  });

}


storyboardBtn.addEventListener("click", async function(){

  const title =
    document.getElementById("songTitle").value.trim();

  const artist =
    document.getElementById("artist").value.trim();

  const duration =
    document.getElementById("duration").value;

  const format =
    document.getElementById("format").value;

  const lyrics =
    document.getElementById("lyrics").value.trim();

  if(!title){

    showStatus(
      "Masukkan judul lagu terlebih dahulu.",
      "error"
    );

    return;
  }

  if(!lyrics){

    showStatus(
      "Masukkan lirik lagu terlebih dahulu.",
      "error"
    );

    return;
  }

  storyboardBtn.disabled = true;

  resultCard.classList.add("hidden");

  showStatus(
    "🤖 Gemini sedang membaca cerita lagu dan membuat storyboard cinematic...",
    ""
  );

  const prompt = `

You are a professional music-film director and cinematic storyboard writer.

Create a complete cinematic music video storyboard from the song below.

SONG TITLE:
${title}

ARTIST:
${artist}

TARGET FILM DURATION:
${duration} minutes

VIDEO FORMAT:
${format}

IMPORTANT REQUIREMENTS:

1. Create exactly 24 cinematic scenes.
2. The scenes must tell ONE continuous story from beginning to end.
3. Keep the main character visually consistent in every scene.
4. Define the main character clearly and reuse the same identity.
5. The story must follow the emotional meaning of the lyrics.
6. Use cinematic film language.
7. Each scene should feel like a real movie shot.
8. Avoid random unrelated visuals.
9. Include camera movement.
10. Include lighting and atmosphere inside the visual description.
11. Create emotional progression:
   beginning → conflict → pain → realization → freedom.
12. The same characters, clothing style and visual identity must remain consistent.
13. Do not create dialogue unless the lyrics require it.
14. The music itself is the soundtrack.
15. Do not include subtitles or text on screen.
16. Make the scenes suitable for later AI video generation.
17. Every scene should be visually different but connected to the previous scene.
18. The final scene must provide emotional closure.
19. Use approximately 10 seconds per scene.
20. Do not exceed the requested film duration.

RETURN ONLY VALID JSON.

Use exactly this structure:

{
  "mainCharacter": {
    "name": "",
    "appearance": "",
    "clothing": "",
    "age": "",
    "personality": ""
  },
  "visualStyle": "",
  "overallStory": "",
  "scenes": [
    {
      "start": "00:00",
      "end": "00:10",
      "title": "",
      "story": "",
      "visual": "",
      "camera": "",
      "mood": "",
      "character": "",
      "location": ""
    }
  ]
}

LYRICS:

${lyrics}

`;

  try{

    const response = await fetch("/api/generate",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        prompt:prompt
      })

    });

    const raw = await response.text();

    let result;

    try{

      result = JSON.parse(raw);

    }catch(e){

      throw new Error(
        "Server mengembalikan data yang bukan JSON. Pastikan Vercel sudah terhubung dengan API."
      );

    }

    if(!response.ok){

      throw new Error(
        typeof result.error === "string"
          ? result.error
          : "Terjadi kesalahan pada server."
      );

    }

    let text = result.text || "";

    text = cleanJsonText(text);

    let storyboard;

    try{

      storyboard = JSON.parse(text);

    }catch(e){

      const first = text.indexOf("{");
      const last = text.lastIndexOf("}");

      if(first >= 0 && last > first){

        storyboard =
          JSON.parse(
            text.substring(first,last + 1)
          );

      }else{

        throw new Error(
          "Gemini tidak mengembalikan storyboard JSON yang valid."
        );

      }

    }

    if(
      !storyboard ||
      !Array.isArray(storyboard.scenes)
    ){

      throw new Error(
        "Storyboard belum memiliki daftar scene."
      );

    }

    resultCard.classList.remove("hidden");

    filmInfo.innerHTML = `
      <strong>Karakter utama:</strong>
      ${escapeHtml(
        storyboard.mainCharacter?.name || "Main Character"
      )}
      <br>
      <strong>Gaya visual:</strong>
      ${escapeHtml(
        storyboard.visualStyle || ""
      )}
      <br>
      <strong>Jumlah scene:</strong>
      ${storyboard.scenes.length}
    `;

    renderScenes(storyboard);

    showStatus(
      "✅ Storyboard AI berhasil dibuat. Siap untuk tahap video cinematic.",
      "success"
    );

    resultCard.scrollIntoView({
      behavior:"smooth"
    });

  }catch(error){

    console.error(error);

    showStatus(
      "❌ Gagal: " + error.message,
      "error"
    );

  }finally{

    storyboardBtn.disabled = false;

  }

});

</script>

</body>
</html>
