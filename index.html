<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song To Video AI - Music Film Generator</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0b10;
  color:#eee;
}
.container{
  max-width:900px;
  margin:auto;
  padding:30px 18px 60px;
}
h1{text-align:center;margin-bottom:5px}
.subtitle{text-align:center;color:#aaa;margin-bottom:30px}
.card{
  background:#15151d;
  border:1px solid #292936;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
}
label{
  display:block;
  margin:15px 0 7px;
  color:#ccc;
  font-weight:bold;
}
input,textarea,select{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #3a3a48;
  background:#0e0e14;
  color:white;
  font-size:15px;
}
textarea{
  min-height:260px;
  resize:vertical;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}
button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:9px;
  background:#7c4dff;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{
  opacity:.5;
  cursor:not-allowed;
}
.status{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  background:#101018;
  color:#bbb;
}
.character{
  background:#101018;
  padding:18px;
  border-radius:10px;
  line-height:1.6;
}
.scene{
  background:#101018;
  border:1px solid #292936;
  border-radius:10px;
  padding:15px;
  margin:12px 0;
}
.scene h3{
  margin-top:0;
}
.scene-number{
  color:#9b7cff;
  font-weight:bold;
}
.prompt{
  color:#bbb;
  font-size:14px;
  line-height:1.5;
}
.error{
  color:#ff7777;
}
.success{
  color:#72e6a1;
}
@media(max-width:650px){
  .row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Song To Video AI</h1>
<div class="subtitle">
AI Music Film Generator — Gemini Story & Cinematic Storyboard
</div>

<div class="card">

<label>Judul Lagu</label>
<input id="title" placeholder="Contoh: When The Moon Forgot Her">

<label>Artis</label>
<input id="artist" placeholder="Contoh: Dark Cathedral">

<div class="row">

<div>
<label>Durasi Film</label>
<select id="duration">
<option value="4 minutes">4 menit</option>
<option value="4 minutes 30 seconds">4 menit 30 detik</option>
<option value="5 minutes">5 menit</option>
</select>
</div>

<div>
<label>Format Video</label>
<select id="aspect">
<option value="16:9 cinematic">16:9 Cinematic YouTube</option>
<option value="9:16 vertical">9:16 Shorts / TikTok</option>
</select>
</div>

</div>

<label>Lirik / Cerita Lagu</label>
<textarea id="lyrics" placeholder="Tempel lirik lagu di sini..."></textarea>

<br><br>

<button id="generateBtn" onclick="generateFilm()">
🎬 Buat Storyboard AI
</button>

<div id="status" class="status">
Siap membuat storyboard film dari lagu.
</div>

</div>

<div id="result"></div>

</div>

<script>

async function generateFilm(){

  const title = document.getElementById("title").value.trim();
  const artist = document.getElementById("artist").value.trim();
  const lyrics = document.getElementById("lyrics").value.trim();
  const duration = document.getElementById("duration").value;
  const aspect = document.getElementById("aspect").value;

  const button = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const result = document.getElementById("result");

  if(!title || !lyrics){

    status.innerHTML =
      '<span class="error">Masukkan judul lagu dan lirik terlebih dahulu.</span>';

    return;
  }

  button.disabled = true;
  status.innerHTML = "⏳ Gemini sedang memahami cerita lagu...";
  result.innerHTML = "";

  const prompt = `
You are an expert cinematic music video director.

Create a complete AI music film storyboard from the song information below.

IMPORTANT:
- The film duration must be ${duration}.
- Create exactly 24 cinematic scenes.
- Maintain ONE consistent main character throughout the entire film.
- Character appearance must remain consistent from scene to scene.
- The scenes must follow the emotional story of the lyrics.
- The story should have a clear beginning, development, climax and ending.
- Do not create random unrelated scenes.
- Do not change the main character's age, gender or appearance.
- Every scene must visually connect to the previous scene.
- The soundtrack is the uploaded song.
- Video format: ${aspect}.
- Visual style should be cinematic, emotional and suitable for a professional music video.
- No text, subtitles or logos inside the generated scenes.

Return ONLY valid JSON.

JSON structure:

{
  "film_title": "",
  "logline": "",
  "main_character": {
    "name": "",
    "gender": "",
    "age": "",
    "appearance": "",
    "hair": "",
    "clothing": "",
    "personality": ""
  },
  "visual_style": "",
  "color_mood": "",
  "scenes": [
    {
      "scene": 1,
      "time": "",
      "story": "",
      "visual": "",
      "camera": "",
      "lighting": "",
      "emotion": "",
      "video_prompt": ""
    }
  ]
}

SONG TITLE:
${title}

ARTIST:
${artist}

LYRICS:
${lyrics}
`;

  try{

    const response = await fetch("/api/generate",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        prompt:prompt
      })
    });

    const data = await response.json();

    if(!response.ok){

      throw new Error(
        typeof data.error === "string"
        ? data.error
        : "Gemini gagal memproses permintaan."
      );

    }

    let text = data.text || "";

    text = text
      .replace(/```json/gi,"")
      .replace(/```/g,"")
      .trim();

    const film = JSON.parse(text);

    displayFilm(film);

    status.innerHTML =
      '<span class="success">✅ Storyboard berhasil dibuat oleh Gemini.</span>';

  }catch(error){

    console.error(error);

    status.innerHTML =
      '<span class="error">❌ Gagal: ' +
      escapeHtml(error.message) +
      '</span>';

  }finally{

    button.disabled = false;

  }

}

function displayFilm(film){

  const result = document.getElementById("result");

  let html = "";

  html += `
  <div class="card">

    <h2>🎬 ${escapeHtml(film.film_title || "")}</h2>

    <p>${escapeHtml(film.logline || "")}</p>

    <h3>🎭 Karakter Utama</h3>

    <div class="character">
      <b>Nama:</b> ${escapeHtml(film.main_character?.name || "")}<br>
      <b>Gender:</b> ${escapeHtml(film.main_character?.gender || "")}<br>
      <b>Usia:</b> ${escapeHtml(film.main_character?.age || "")}<br>
      <b>Penampilan:</b> ${escapeHtml(film.main_character?.appearance || "")}<br>
      <b>Rambut:</b> ${escapeHtml(film.main_character?.hair || "")}<br>
      <b>Pakaian:</b> ${escapeHtml(film.main_character?.clothing || "")}<br>
      <b>Kepribadian:</b> ${escapeHtml(film.main_character?.personality || "")}
    </div>

    <h3>🎨 Gaya Visual</h3>
    <p>${escapeHtml(film.visual_style || "")}</p>

    <h3>🌙 Mood Warna</h3>
    <p>${escapeHtml(film.color_mood || "")}</p>

  </div>
  `;

  html += `<div class="card"><h2>🎞️ 24 Cinematic Scenes</h2>`;

  (film.scenes || []).forEach(scene => {

    html += `
    <div class="scene">

      <div class="scene-number">
        SCENE ${escapeHtml(String(scene.scene || ""))}
      </div>

      <h3>${escapeHtml(scene.time || "")}</h3>

      <p>
        <b>Story:</b><br>
        ${escapeHtml(scene.story || "")}
      </p>

      <p>
        <b>Visual:</b><br>
        ${escapeHtml(scene.visual || "")}
      </p>

      <p>
        <b>Camera:</b><br>
        ${escapeHtml(scene.camera || "")}
      </p>

      <p>
        <b>Lighting:</b><br>
        ${escapeHtml(scene.lighting || "")}
      </p>

      <p>
        <b>Emotion:</b><br>
        ${escapeHtml(scene.emotion || "")}
      </p>

      <p class="prompt">
        <b>AI Video Prompt:</b><br>
        ${escapeHtml(scene.video_prompt || "")}
      </p>

    </div>
    `;

  });

  html += `</div>`;

  result.innerHTML = html;
}

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
