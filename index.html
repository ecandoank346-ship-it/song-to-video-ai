<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song To Video AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #202040 0%, #090912 45%, #050508 100%);
  color: #fff;
  min-height: 100vh;
}

.container {
  width: min(1100px, 94%);
  margin: auto;
  padding: 35px 0 70px;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

header h1 {
  margin: 0;
  font-size: 36px;
}

header p {
  color: #bfc1d8;
  margin-top: 10px;
}

.card {
  background: rgba(20, 20, 35, .92);
  border: 1px solid #30304d;
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

h2 {
  margin-top: 0;
}

label {
  display: block;
  margin: 15px 0 7px;
  color: #d8d9e8;
  font-weight: bold;
}

input,
textarea,
select {
  width: 100%;
  border: 1px solid #3b3b5d;
  background: #0d0d18;
  color: #fff;
  border-radius: 10px;
  padding: 13px;
  font-size: 15px;
  outline: none;
}

textarea {
  min-height: 190px;
  resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #7c6cff;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 12px;
  padding: 15px 20px;
  margin-top: 20px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  color: white;
  background: linear-gradient(135deg, #6d5dfc, #9a4dff);
}

button:hover {
  opacity: .9;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.generate {
  background: linear-gradient(135deg, #ff4d8d, #ff7a3d);
}

.status {
  display: none;
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: #111124;
  border: 1px solid #38385c;
  color: #d9daf0;
  white-space: pre-wrap;
}

.storyboard {
  display: none;
}

.scene {
  border: 1px solid #343450;
  background: #0d0d18;
  border-radius: 14px;
  padding: 17px;
  margin: 12px 0;
}

.scene-title {
  font-weight: bold;
  color: #a99cff;
  margin-bottom: 8px;
}

.scene-text {
  color: #d7d8e5;
  line-height: 1.55;
}

.video-plan {
  display: none;
}

.progress {
  height: 14px;
  background: #11111c;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 15px;
  border: 1px solid #303047;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff4d8d, #8e5cff);
  transition: width .4s;
}

.small {
  color: #999bb5;
  font-size: 13px;
  line-height: 1.5;
}

@media(max-width:700px) {
  .row {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 28px;
  }

  .card {
    padding: 18px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🎵 Song To Video AI</h1>
  <p>AI Music Film Generator — Gemini Story & Cinematic Storyboard</p>
</header>

<div class="card">

  <h2>🎵 Data Lagu</h2>

  <label>Upload Lagu</label>
  <input type="file" id="audioFile" accept="audio/*">

  <div class="row">

    <div>
      <label>Judul Lagu</label>
      <input
        type="text"
        id="songTitle"
        value="Let Me Go"
        placeholder="Contoh: Let Me Go">
    </div>

    <div>
      <label>Artis</label>
      <input
        type="text"
        id="artist"
        value="Liora"
        placeholder="Contoh: Liora">
    </div>

  </div>

  <div class="row">

    <div>
      <label>Durasi Film</label>
      <select id="duration">
        <option value="240">4 Menit</option>
        <option value="270" selected>4 Menit 30 Detik</option>
        <option value="300">5 Menit</option>
      </select>
    </div>

    <div>
      <label>Format Video</label>
      <select id="format">
        <option value="16:9" selected>16:9 — YouTube</option>
        <option value="9:16">9:16 — Shorts / TikTok</option>
      </select>
    </div>

  </div>

  <label>Lirik Lagu</label>

  <textarea id="lyrics">Let me go... I won't chase you again
You broke the heart that trusted you
But I survived what you put me through

Let me go... I finally see the truth
I lost myself while loving you
You chose her, so I'll choose me
This is the end... now let me be free

[Outro]
Let me go...
Don't come back...
I've cried enough for you...
Now I'm choosing my heart.</textarea>

  <button id="storyButton" onclick="createStoryboard()">
    🤖 Buat Storyboard AI
  </button>

  <div id="status" class="status"></div>

</div>


<div id="storyboardCard" class="card storyboard">

  <h2>🎬 AI Cinematic Storyboard</h2>

  <div id="storyboard"></div>

  <button
    id="generateButton"
    class="generate"
    onclick="generateVideo()">
    🎬 Generate Video
  </button>

</div>


<div id="videoPlanCard" class="card video-plan">

  <h2>🎥 AI Music Film</h2>

  <p id="videoStatus">
    Menyiapkan film berdasarkan storyboard...
  </p>

  <div class="progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <p class="small" id="progressText">
    Mempersiapkan scene...
  </p>

</div>

</div>


<script>

const API_URL =
  "https://song-to-video-ai.vercel.app/api/generate";


let generatedScenes = [];


/* =========================
   STATUS
========================= */

function showStatus(message) {

  const box = document.getElementById("status");

  box.style.display = "block";

  box.textContent = message;
}


/* =========================
   STORYBOARD
========================= */

async function createStoryboard() {

  const button = document.getElementById("storyButton");

  const title =
    document.getElementById("songTitle").value.trim();

  const artist =
    document.getElementById("artist").value.trim();

  const lyrics =
    document.getElementById("lyrics").value.trim();

  const duration =
    Number(document.getElementById("duration").value);

  if (!title) {
    showStatus("Masukkan judul lagu.");
    return;
  }

  if (!lyrics) {
    showStatus("Masukkan lirik lagu.");
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ AI sedang membaca cerita lagu...";

  showStatus(
    "Gemini sedang menganalisis lirik dan membuat storyboard cinematic..."
  );

  const sceneCount =
    Math.max(24, Math.min(30, Math.round(duration / 10)));

  const prompt = `
You are an expert cinematic music video director.

Create a detailed cinematic music film storyboard.

SONG TITLE:
${title}

ARTIST:
${artist}

SONG DURATION:
${Math.floor(duration / 60)} minutes ${duration % 60} seconds

TARGET SCENES:
${sceneCount}

LYRICS:
${lyrics}

Requirements:

1. Understand the emotional story of the lyrics.
2. Create a coherent beginning, middle and ending.
3. Use consistent main characters.
4. Keep character appearance consistent across all scenes.
5. Create cinematic visual continuity.
6. Every scene must logically continue from the previous scene.
7. Use emotional facial expressions and cinematic camera movement.
8. Include environment, lighting and atmosphere.
9. Do not randomly change the main character.
10. Build a professional music-film narrative.
11. The film should feel suitable for a 4–5 minute song.
12. No choir.
13. No subtitles inside the video.
14. No text or watermark inside the generated scenes.

Return ONLY JSON.

Use exactly this structure:

{
  "character": {
    "name": "",
    "gender": "",
    "age": "",
    "appearance": "",
    "clothing": "",
    "hair": "",
    "personality": ""
  },
  "story": "",
  "scenes": [
    {
      "scene": 1,
      "time": "",
      "description": "",
      "camera": "",
      "lighting": "",
      "emotion": "",
      "continuity": ""
    }
  ]
}
`;

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: prompt
      })

    });


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data?.details?.error?.message ||
        data?.error ||
        "Gemini API error"
      );

    }


    let text = data.text || "";

    text = text
      .replace(/```json/gi, "")
      .replace(/```/g, "")
      .trim();


    let result;

    try {

      result = JSON.parse(text);

    } catch (e) {

      throw new Error(
        "Gemini menghasilkan format storyboard yang tidak dapat dibaca."
      );

    }


    if (!result.scenes || !Array.isArray(result.scenes)) {

      throw new Error(
        "Storyboard tidak memiliki daftar scene."
      );

    }


    generatedScenes = result.scenes;


    displayStoryboard(result);


    showStatus(
      "✅ Storyboard berhasil dibuat. Sekarang Anda dapat menekan Generate Video."
    );

  } catch (error) {

    console.error(error);

    showStatus(
      "❌ Gagal membuat storyboard:\n\n" +
      error.message
    );

  } finally {

    button.disabled = false;

    button.textContent =
      "🤖 Buat Storyboard AI";

  }

}


/* =========================
   DISPLAY STORYBOARD
========================= */

function displayStoryboard(data) {

  const card =
    document.getElementById("storyboardCard");

  const container =
    document.getElementById("storyboard");

  container.innerHTML = "";


  if (data.character) {

    const characterBox =
      document.createElement("div");

    characterBox.className = "scene";

    characterBox.innerHTML = `
      <div class="scene-title">
        👤 MAIN CHARACTER
      </div>

      <div class="scene-text">
        <b>${escapeHTML(data.character.name || "")}</b><br>
        ${escapeHTML(data.character.appearance || "")}<br>
        ${escapeHTML(data.character.clothing || "")}<br>
        ${escapeHTML(data.character.personality || "")}
      </div>
    `;

    container.appendChild(characterBox);

  }


  if (data.story) {

    const storyBox =
      document.createElement("div");

    storyBox.className = "scene";

    storyBox.innerHTML = `
      <div class="scene-title">
        📖 STORY
      </div>

      <div class="scene-text">
        ${escapeHTML(data.story)}
      </div>
    `;

    container.appendChild(storyBox);

  }


  data.scenes.forEach(scene => {

    const div =
      document.createElement("div");

    div.className = "scene";

    div.innerHTML = `

      <div class="scene-title">
        🎬 Scene ${escapeHTML(String(scene.scene || ""))}
        ${scene.time ? " — " + escapeHTML(scene.time) : ""}
      </div>

      <div class="scene-text">

        <b>Visual:</b><br>
        ${escapeHTML(scene.description || "")}

        <br><br>

        <b>Camera:</b><br>
        ${escapeHTML(scene.camera || "")}

        <br><br>

        <b>Lighting:</b><br>
        ${escapeHTML(scene.lighting || "")}

        <br><br>

        <b>Emotion:</b><br>
        ${escapeHTML(scene.emotion || "")}

        <br><br>

        <b>Continuity:</b><br>
        ${escapeHTML(scene.continuity || "")}

      </div>
    `;

    container.appendChild(div);

  });


  card.style.display = "block";

  card.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =========================
   GENERATE VIDEO
========================= */

function generateVideo() {

  if (!generatedScenes.length) {

    showStatus(
      "Buat Storyboard AI terlebih dahulu."
    );

    return;

  }


  const card =
    document.getElementById("videoPlanCard");

  const status =
    document.getElementById("videoStatus");

  const progress =
    document.getElementById("progressBar");

  const progressText =
    document.getElementById("progressText");


  card.style.display = "block";


  status.textContent =
    "🎬 Storyboard siap diproses menjadi AI Music Film.";


  progress.style.width = "10%";

  progressText.textContent =
    generatedScenes.length +
    " cinematic scenes siap dikirim ke engine video AI.";


  /*
    Tahap ini belum memanggil Veo.

    Kita sengaja menyiapkan pipeline terlebih dahulu.
    Setelah frontend berhasil, backend Veo akan ditambahkan.
  */

  setTimeout(() => {

    progress.style.width = "30%";

    status.textContent =
      "👤 Character consistency siap digunakan.";

    progressText.textContent =
      "Menyiapkan karakter utama dan continuity...";

  }, 700);


  setTimeout(() => {

    progress.style.width = "55%";

    status.textContent =
      "🎥 Scene cinematic sudah disiapkan.";

    progressText.textContent =
      "Target: 4–5 menit • " +
      generatedScenes.length +
      " scenes";

  }, 1400);


  setTimeout(() => {

    progress.style.width = "75%";

    status.textContent =
      "⚙️ Video engine siap disambungkan ke Veo.";

    progressText.textContent =
      "Tahap berikutnya: generate clip video AI.";

  }, 2100);


  setTimeout(() => {

    progress.style.width = "100%";

    status.textContent =
      "✅ Video pipeline siap.\n\n" +
      "Mesin Veo belum diaktifkan pada tahap ini.";

    progressText.textContent =
      "Storyboard → Character → Scene → Video Engine";

  }, 2800);


  card.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}

</script>

</body>
</html>
