<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Song To Video AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b0b0f;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #999;
  margin-bottom: 25px;
}

.card {
  background: #15151c;
  border: 1px solid #292936;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 7px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  background: #0e0e13;
  color: white;
  border: 1px solid #393945;
  border-radius: 8px;
  font-size: 15px;
}

textarea {
  min-height: 160px;
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 0;
  border-radius: 9px;
  background: #6c5ce7;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:disabled {
  opacity: .5;
}

.generate {
  background: #e84393;
  font-size: 18px;
}

.error {
  display: none;
  margin-top: 15px;
  padding: 14px;
  background: #35151a;
  border: 1px solid #8b2635;
  border-radius: 9px;
  color: #ffb3bd;
  white-space: pre-wrap;
}

.storyboard {
  display: none;
}

.character {
  background: #101018;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 18px;
}

.story {
  background: #101018;
  border: 1px solid #30303d;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 12px;
}

.story h3 {
  color: #ff79b0;
  margin-top: 0;
}

.time {
  color: #aaa;
  font-size: 14px;
}

.progress {
  display: none;
  margin-top: 18px;
  padding: 15px;
  background: #101018;
  border-radius: 10px;
}

.small {
  color: #999;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Song To Video AI</h1>

<div class="subtitle">
AI Music Film Generator
</div>


<div class="card">

<label>🎵 Upload Lagu</label>
<input
  type="file"
  id="songFile"
  accept="audio/*"
>


<label>🎼 Judul Lagu</label>

<input
  type="text"
  id="songTitle"
  placeholder="Contoh: Let Me Go"
>


<label>🎤 Artis</label>

<input
  type="text"
  id="artist"
  placeholder="Contoh: Liora"
>


<label>⏱️ Durasi Lagu</label>

<select id="duration">

<option value="4">
4 Menit
</option>

<option value="4.5">
4 Menit 30 Detik
</option>

<option value="5">
5 Menit
</option>

</select>


<label>📺 Format Video</label>

<select id="format">

<option value="16:9">
16:9 Cinematic YouTube
</option>

<option value="9:16">
9:16 TikTok / Shorts
</option>

</select>


<label>📝 Lirik Lagu</label>

<textarea
  id="lyrics"
  placeholder="Masukkan lirik lagu..."
></textarea>


<button id="storyboardBtn">
🤖 Buat Storyboard AI
</button>


<div id="errorBox" class="error"></div>

</div>



<div
  id="storyboardCard"
  class="card storyboard"
>

<h2>🎞️ Storyboard AI</h2>

<p class="small">
8 bagian cerita utama dengan durasi sekitar
30–40 detik setiap bagian.
</p>


<div
  id="characterBox"
  class="character"
></div>


<div id="stories"></div>


<button
  id="generateBtn"
  class="generate"
>
🎬 Generate Video
</button>


<div
  id="progressBox"
  class="progress"
>

<strong id="progressTitle">
🎥 Menyiapkan video...
</strong>

<p id="progressText">
Menunggu proses video.
</p>

</div>

</div>

</div>



<script>

const API_URL =
"https://song-to-video-ai.vercel.app/api/generate";


const storyboardBtn =
document.getElementById("storyboardBtn");

const generateBtn =
document.getElementById("generateBtn");

const storyboardCard =
document.getElementById("storyboardCard");

const errorBox =
document.getElementById("errorBox");

const characterBox =
document.getElementById("characterBox");

const stories =
document.getElementById("stories");

const progressBox =
document.getElementById("progressBox");

const progressTitle =
document.getElementById("progressTitle");

const progressText =
document.getElementById("progressText");



function showError(message) {

errorBox.style.display = "block";

errorBox.textContent = message;

}



function hideError() {

errorBox.style.display = "none";

errorBox.textContent = "";

}



function durationText() {

const value =
document.getElementById("duration").value;

if (value === "4") {
return "4 menit";
}

if (value === "4.5") {
return "4 menit 30 detik";
}

return "5 menit";

}



storyboardBtn.addEventListener(
"click",
async function () {

hideError();


const title =
document.getElementById("songTitle")
.value.trim();

const artist =
document.getElementById("artist")
.value.trim();

const lyrics =
document.getElementById("lyrics")
.value.trim();

const duration =
durationText();

const format =
document.getElementById("format")
.value;


if (!title) {

showError(
"Judul lagu belum diisi."
);

return;

}


if (!lyrics) {

showError(
"Lirik lagu belum diisi."
);

return;

}



storyboardBtn.disabled = true;

storyboardBtn.textContent =
"🤖 AI sedang membuat cerita...";



/*
PROMPT RINGAN

Tidak meminta scene detail,
kamera detail,
lighting detail,
atau output panjang.

Hanya meminta 8 story utama.
*/


const prompt = `

Buat storyboard video musik
yang sederhana dan sinematik.

Judul:
${title}

Artis:
${artist}

Durasi:
${duration}

Format:
${format}

Lirik:
${lyrics}

Buat tepat 8 bagian cerita.

Setiap bagian sekitar
30 sampai 40 detik.

Cerita harus saling terhubung
dari awal sampai akhir.

Gunakan satu karakter utama
yang konsisten.

Jangan membuat detail terlalu panjang.

Untuk setiap bagian cukup berikan:

- nomor
- waktu
- judul
- cerita singkat
- suasana
- lokasi

Buat hasil dalam JSON valid.

Format:

{
"character": {
"name": "",
"appearance": "",
"clothing": ""
},
"stories": [
{
"number": 1,
"time": "0:00-0:35",
"title": "",
"story": "",
"mood": "",
"location": ""
}
]

}

Harus tepat 8 stories.

Jangan gunakan markdown.
Hanya JSON.
`;



try {

const response =
await fetch(API_URL, {

method: "POST",

headers: {
"Content-Type":
"application/json"
},

body: JSON.stringify({
prompt: prompt
})

});


const raw =
await response.text();


let data;

try {

data = JSON.parse(raw);

} catch {

throw new Error(
"Server mengembalikan data tidak valid."
);

}



if (!response.ok) {

const message =
data?.error?.error?.message ||
data?.error?.message ||
data?.error ||
"Gagal menghubungi Gemini.";

throw new Error(message);

}



let text =
data?.text || "";


if (!text) {

throw new Error(
"Gemini tidak mengembalikan storyboard."
);

}



text = text
.replace(/```json/gi, "")
.replace(/```/g, "")
.trim();



let result;

try {

result = JSON.parse(text);

} catch {

throw new Error(
"Format storyboard dari AI tidak valid."
);

}



displayStoryboard(result);


}

catch (error) {

showError(
"Gagal membuat storyboard:\n\n" +
error.message
);

}

finally {

storyboardBtn.disabled = false;

storyboardBtn.textContent =
"🤖 Buat Storyboard AI";

}

});



function displayStoryboard(data) {

storyboardCard.style.display =
"block";

stories.innerHTML = "";

characterBox.innerHTML = "";


const character =
data.character || {};


characterBox.innerHTML = `

<h3>👤 Karakter Utama</h3>

<p>
<strong>Nama:</strong>
${character.name || "-"}
</p>

<p>
<strong>Penampilan:</strong>
${character.appearance || "-"}
</p>

<p>
<strong>Pakaian:</strong>
${character.clothing || "-"}
</p>

`;


const list =
Array.isArray(data.stories)
? data.stories
: [];


list.forEach(
(story, index) => {


const box =
document.createElement("div");

box.className =
"story";


box.innerHTML = `

<h3>
🎬 Story ${story.number || index + 1}
</h3>

<div class="time">
⏱️ ${story.time || "30–40 detik"}
</div>

<p>
<strong>
${story.title || ""}
</strong>
</p>

<p>
${story.story || ""}
</p>

<p>
<strong>Suasana:</strong>
${story.mood || "-"}
</p>

<p>
<strong>Lokasi:</strong>
${story.location || "-"}
</p>

`;


stories.appendChild(box);

});


storyboardCard.scrollIntoView({
behavior: "smooth"
});

}



generateBtn.addEventListener(
"click",
function () {

progressBox.style.display =
"block";

progressTitle.textContent =
"🎬 Generate Video siap";

progressText.textContent =
"Storyboard sudah siap. Tahap berikutnya kita akan menghubungkan tombol ini dengan Veo.";

generateBtn.disabled = true;

generateBtn.textContent =
"🎥 Menyiapkan Video AI...";


setTimeout(
function () {

progressTitle.textContent =
"✅ Storyboard siap untuk Veo";

progressText.textContent =
"Mesin video Veo akan kita sambungkan pada tahap berikutnya.";

generateBtn.disabled = false;

generateBtn.textContent =
"🎬 Generate Video";

},
2000
);

});

</script>

</body>
</html>
